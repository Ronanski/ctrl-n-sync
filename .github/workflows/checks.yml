name: Checks
# Runs on every push. A green Checks run on a branch publishes the Beta site (site.yml); on main it publishes Stable.
on: [push, workflow_dispatch]
permissions: { contents: read }
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none' } # the beta number is the commit count of main (tools/app-version.js)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: No version number and no built html in the PR, and an update report (lane plan 2026-11-25)
        run: |
          for i in 1 2 3; do git fetch -q origin +refs/heads/main:refs/remotes/origin/main && break; sleep $((i*5)); done
          node tools/version-check.js
      - name: Build the html from the sources (it is not in git; src/ is the truth)
        run: node tools/build/build.js
      - name: The multi-file app folder (for the apk / exe) builds from the html
        run: |
          V=$(node tools/version.js)
          node tools/build/app-folder.js "dist/logic-sim-v$V.html" /tmp/app-folder
          # the analog script by name, not by number: a lane data script (PR 0 lanedatajs) over 2,000 characters becomes its own file and
          # shifts the numbers of the files after it
          A=$(cd /tmp/app-folder/js && ls *-analogjs.js | head -1)
          test -n "$A" && test -f /tmp/app-folder/index.html && test -f /tmp/app-folder/js/data-pre.js
          grep -q "src=\"js/$A\"" /tmp/app-folder/index.html
      - name: The Operator Station page (src/station) builds from the html, and its app folder too
        run: |
          V=$(node tools/version.js)
          node tools/station/build.js "dist/logic-sim-v$V.html" /tmp/station/index.html
          grep -q 'window.LS_STATION=1' /tmp/station/index.html
          grep -q "ronanski.github.io/ctrl-n-sync/'" /tmp/station/index.html
          AV=$(node tools/station/build.js --version)
          grep -q "<title>Logic Sim v$AV</title>" /tmp/station/index.html
          grep -q "window.LS_STATION_VER=\"v$AV\"" /tmp/station/index.html
          node tools/build/app-folder.js /tmp/station/index.html /tmp/station-folder
          SA=$(cd /tmp/station-folder/js && ls *-analogjs.js | head -1)
          test -n "$SA" && test -f /tmp/station-folder/index.html
      - name: One html, version in file name and title
        run: |
          V=$(node tools/version.js)
          F=dist/logic-sim-v$V.html
          grep -q "<title>Logic Sim v$V</title>" "$F" || { echo "title does not say v$V"; exit 1; }
          grep -qE "c3\.textContent ?= ?'v$V'" "$F" || { echo "version label does not say v$V"; exit 1; }
      - name: The same sources build exactly the same html again
        run: node tools/build/build.js --check
      - name: No per-load tables or plant trend / snapshot fits in the physics (RULES.md 3.12, user 2026-11-24)
        run: node tools/check/no-fit.cjs
      - name: One path per plant value, the existing model repaired in place (user 2026-11-27, Phase 11)
        run: node tools/check/one-path.cjs
      - name: TCS soft logic sheets (straight wires only, keys, sources)
        run: node tools/data/tce_check.mjs
      - name: TCS block meanings from the HIACS macro list, every kind on the sheets known (Audit 3 #4 step 2)
        run: node tests/tce/run.cjs
      - name: Every other TCS test (tests/tce/*.cjs) and every lane test (tests/lanes/<lane>/*.cjs), lane plan 2026-11-25 PR 0
        run: node tests/lanes/run-all.cjs
      - name: No team or build name in the operator step texts (Mina B79-2)
        run: node tools/ui-audit/operator-text-check.js
      - name: Scripts of the html parse (every script, also the ones with an id; the old check read only the 4 without one)
        run: |
          node -e "
          const s=require('fs').readFileSync('dist/'+require('fs').readdirSync('dist').find(x=>/^logic-sim-v.*\.html$/.test(x)),'utf8');
          const m=[...s.matchAll(/<script(\s[^>]*)?>([\s\S]*?)<\/script>/g)].filter(x=>!/type=.(?!text\/javascript|module)/.test(x[1]||''));let bad=0;
          for(const x of m){try{new Function(x[2])}catch(e){bad++;console.log((x[1]||'').trim(),e.message)}}
          if(bad||!m.length)process.exit(1);console.log('scripts ok',m.length)"
      - name: Playwright and the browser for the behaviour gate (no apt step, as sim-tests.yml)
        run: |
          for i in 1 2 3; do npm install --no-save --no-package-lock playwright@1.64.1 && break; sleep $((i*5)); done
          echo "PLAYWRIGHT_MODULE=$PWD/node_modules/playwright" >> "$GITHUB_ENV"
          B="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$B" ]; then npx playwright install chromium; B="$(node -e "console.log(require('playwright').chromium.executablePath())")"; fi
          echo "CHROMIUM=$B" >> "$GITHUB_ENV"
      - name: BEHAVIOUR GATE (Full Audit 3 Phase 0) - steady 150 MW at a fixed 0.5 s step, no drift, same numbers twice, SAVE / LOAD
        timeout-minutes: 30
        run: |
          V=$(node tools/version.js)
          node tools/station/build.js "dist/logic-sim-v$V.html" /tmp/gate/index.html
          node tests/gate/behaviour.cjs /tmp/gate/index.html --mins 20
      - name: INSTRUCTOR GATE (Phase 13) - Plant menu, freeze, slow / fast speed, backtrack, malfunction, field action, Warm / Hot restarts
        timeout-minutes: 20
        run: node tests/gate/instructor.cjs /tmp/gate/index.html
      - name: ALARMS (Phase 10) - alarm line with time and level, priority, ACK, back to normal, ACK ALL, event log in time order (tests/gate/alarms.cjs)
        timeout-minutes: 10
        run: |
          V=$(node tools/version.js)
          node tools/station/build.js "dist/logic-sim-v$V.html" /tmp/gate-alarms/index.html
          node tests/gate/alarms.cjs /tmp/gate-alarms/index.html
      - name: ABC VALUES LAYOUT - no live value on a text, a value, a block or a wire, side values level, top / bottom values centred (54 sheets)
        timeout-minutes: 10
        run: |
          V=$(node tools/version.js)
          node tests/regress/values_layout.js "dist/logic-sim-v$V.html"
      - name: HX SHARED CORE - machine monitor rows and VCB point on the faceplates, dotted an keys, TCS CRT buttons and lamps
        timeout-minutes: 15
        run: |
          V=$(node tools/version.js)
          node tests/regress/hx_fp_mon.js "dist/logic-sim-v$V.html"
          node tests/regress/hx_unknown.js "dist/logic-sim-v$V.html"
          node tests/regress/hx_values.js "dist/logic-sim-v$V.html"
