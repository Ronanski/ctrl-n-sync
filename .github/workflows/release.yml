name: Release apk + exe
# Manual. Builds the app for Android (apk) and Windows (portable exe) and, with dry_run false, publishes a GitHub Release.
# The version is tools/app-version.js (delivery/app/app.json "X.Y.Z-beta" + the commit count of main, or a Final "X.Y.Z"):
#   X.Y.Z-beta.N = EA build  -> a pre-release named "<name> vX.Y.Z-beta.N (EA)"
#   X.Y.Z        = Final     -> a release named "<name> vX.Y.Z" and the tag the Stable page of the site follows
# input go must be exactly "GO v<version>". Files: <NAME>-<version>.apk, <NAME>-<version>-Windows.exe, <NAME>-<version>.html,
# and <NAME>-<version>-Report.pdf when docs/versions/v<version>/Release-Report-v<version>.pdf exists.
# The apk and the exe carry the app inside (they open at once and work without internet). The page asks the site for a newer
# version of its channel (Stable or Beta, the switch is in the version popup) and installs it inside the app when the user agrees,
# so a new apk / exe is needed only when the shell itself changes.
# apk signing: the release key is in the GitHub secrets ANDROID_KEYSTORE_B64 (the PKCS12 keystore, base64) and ANDROID_KS_PASS,
# alias lmypots. No key or password in the repo (Full Audit 3, Phase 0). The old key delivery/signing/logic-sim.jks is retired:
# the first apk with the new key needs one reinstall on the tablet.
on:
  workflow_dispatch:
    inputs:
      go: { description: 'Type exactly: GO v<version>', required: true, type: string }
      dry_run: { description: 'true = build only, no GitHub Release', required: true, default: 'true', type: choice, options: ['true', 'false'] }
permissions: { contents: write }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { version: '${{ steps.v.outputs.version }}', code: '${{ steps.v.outputs.code }}', ea: '${{ steps.v.outputs.ea }}', name: '${{ steps.v.outputs.name }}', id: '${{ steps.v.outputs.id }}', file: '${{ steps.v.outputs.file }}' }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none' } # the beta number is the commit count of main (tools/app-version.js)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: v
        run: |
          V=$(node tools/station/build.js --version)
          [ "${{ inputs.go }}" = "GO v$V" ] || { echo "go must be exactly: GO v$V"; exit 1; }
          case "$V" in *-beta*) EA=true;; *) EA=false;; esac
          # Android version code: X*1000000 + Y*10000 + Z*100 + (beta N, or 99 for the Final), so every later build is a higher number
          CODE=$(node -e "const m=process.argv[1].match(/^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?$/);console.log(m[1]*1000000+m[2]*10000+m[3]*100+(m[4]?Math.min(+m[4],98):99))" "$V")
          {
            echo "version=$V"; echo "code=$CODE"; echo "ea=$EA"
            echo "name=$(node -p "require('./delivery/app/app.json').name")"
            echo "id=$(node -p "require('./delivery/app/app.json').id")"
            echo "file=$(node tools/station/build.js --file)"
          } >> "$GITHUB_OUTPUT"
          echo "v$V  code $CODE  EA $EA"
  apk:
    needs: gate
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.ANDROID_KS_PASS }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none' } # the beta number is the commit count of main (tools/app-version.js)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor project
        working-directory: delivery/android
        run: |
          cat > capacitor.config.json <<EOF
          {"appId":"${{ needs.gate.outputs.id }}","appName":"${{ needs.gate.outputs.name }}","webDir":"www","server":{"androidScheme":"https"}}
          EOF
          node ../../tools/build/build.js
          # the app is built into the apk as a FOLDER (index.html + js/*.js, same content as the single page; opens at once, works without internet)
          node ../../tools/station/build.js "$(ls ../../dist/logic-sim-v*.html | head -1)" station-page/index.html
          node ../../tools/build/app-folder.js station-page/index.html www
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          # app icon (delivery/app/icons): launcher icons of every density + adaptive icon background
          cp -r ../app/icons/android/res/. android/app/src/main/res/
          sed -i "s/versionName \".*\"/versionName \"${{ needs.gate.outputs.version }}\"/; s/versionCode [0-9]*/versionCode ${{ needs.gate.outputs.code }}/" android/app/build.gradle
          grep -E "versionName|versionCode" android/app/build.gradle
      - name: Build + sign
        working-directory: delivery/android/android
        run: |
          [ -n "$KS_PASS" ] && [ -n "$KS_B64" ] || { echo "secrets ANDROID_KEYSTORE_B64 / ANDROID_KS_PASS are not set"; exit 1; }
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --no-daemon
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --key-pass env:KS_PASS --ks-key-alias lmypots --out "../../app.apk" aligned.apk
          $BT/apksigner verify "../../app.apk"
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: delivery/app.apk }
  exe:
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none' } # the beta number is the commit count of main (tools/app-version.js)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build portable exe
        working-directory: delivery/desktop
        shell: bash
        run: |
          node -e "const a=require('../app/app.json');require('fs').writeFileSync('config.json',JSON.stringify({name:a.name,url:a.site,data:a.name}))"
          node ../../tools/build/build.js
          node ../../tools/station/build.js "$(ls ../../dist/logic-sim-v*.html | head -1)" station-page/index.html
          node ../../tools/build/app-folder.js station-page/index.html www
          # app icon (delivery/app/icons): the exe file icon and the window icon
          mkdir -p build && cp ../app/icons/icon.ico build/icon.ico && cp ../app/icons/png/icon-256.png icon.png
          npm install --no-audit --no-fund
          npx electron-builder --win portable -c.productName="${{ needs.gate.outputs.name }}" -c.appId=${{ needs.gate.outputs.id }} -c.extraMetadata.version=${{ needs.gate.outputs.version }}
          ls dist
      - uses: actions/upload-artifact@v4
        with: { name: exe, path: 'delivery/desktop/dist/*-portable.exe' }
  publish:
    needs: [gate, apk, exe]
    if: inputs.dry_run == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, filter: 'blob:none' } # the beta number is the commit count of main (tools/app-version.js)
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: GitHub Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=${{ needs.gate.outputs.version }}
          T=v$V
          N="${{ needs.gate.outputs.name }}"
          F="${{ needs.gate.outputs.file }}"
          mkdir rel
          find out/apk -type f -name '*.apk' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/$F.apk"; done
          find out/exe -type f -name '*.exe' -print0 | while IFS= read -r -d '' f; do cp "$f" "rel/$F-Windows.exe"; done
          node tools/build/build.js
          node tools/station/build.js "$(ls dist/logic-sim-v*.html | head -1)" "rel/$F.html"
          [ -f "docs/versions/v$V/Release-Report-v$V.pdf" ] && cp "docs/versions/v$V/Release-Report-v$V.pdf" "rel/$F-Report.pdf" || echo "no release report pdf for v$V"
          ls rel
          if [ "${{ needs.gate.outputs.ea }}" = true ]; then KIND="EA build (Beta)"; TITLE="$N $T (EA)"; PRE=--prerelease; else KIND="Final (Stable)"; TITLE="$N $T"; PRE=--latest; fi
          NOTES="$N $V, $KIND. Files: $F.apk (Android), $F-Windows.exe (Windows, portable, no install), $F.html (opens in a browser). The app asks the site for a newer version of its channel and installs it inside the app when you agree; the channel (Stable or Beta) is in the version popup."
          if gh release view "$T" >/dev/null 2>&1; then
            gh release upload "$T" rel/* --clobber
          else
            gh release create "$T" rel/* --title "$TITLE" --notes "$NOTES" --target "${{ github.sha }}" $PRE
          fi
