name: Site (Stable + Beta)
# The site of the app. Stable = the page of the latest Stable tag (vX.Y.Z, made only on GO STABLE) at /, Beta = the page of main at /beta/.
# The page is the station frame over the simulator html (tools/station/build.js). The apk / exe ask this site for a newer version.
# version.json carries the versions of the app (delivery/app/app.json), not those of the simulator inside.
# Until the first Stable tag exists, / carries the page of main too (version.json then names no Stable, so nothing is offered as one).
# Runs only while the repository is public: GitHub Pages of a private repository needs a paid plan.
on:
  workflow_run: { workflows: [Checks], types: [completed] }
  workflow_dispatch: # by hand (after a GO STABLE release: the Stable page takes the new tag at once)
permissions: { contents: read, pages: write, id-token: write }
jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')) && !github.event.repository.private
    concurrency: { group: pages, cancel-in-progress: false }
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: beta, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Assemble
        run: |
          mkdir -p site/beta
          B=$(ls beta/dist/logic-sim-v*.html | head -1)
          bv=v$(node beta/tools/station/build.js --version)
          node beta/tools/station/build.js "$B" site/beta/index.html
          T=$(git -C beta tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$T" ]; then
            git -C beta worktree add -q ../stable "$T"; echo "Stable page: $T"
            S=$(ls stable/dist/logic-sim-v*.html | head -1)
            sv=v$(node stable/tools/station/build.js --version)
            node stable/tools/station/build.js "$S" site/index.html; P=stable
          else
            echo "no Stable tag yet: / carries the page of main"
            sv=""; P=beta; cp site/beta/index.html site/index.html
          fi
          echo "{\"stable\":\"$sv\",\"beta\":\"$bv\"}" > site/version.json
          for f in manifest.webmanifest icon-192.png icon-512.png; do cp "beta/delivery/app/pwa/$f" site/beta/; cp "$P/delivery/app/pwa/$f" site/; done
          cp beta/delivery/app/pwa/sw.js site/beta/sw.js; cp "$P/delivery/app/pwa/sw.js" site/sw.js
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: d
        uses: actions/deploy-pages@v4
